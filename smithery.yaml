name: "@foundrynet/brand-intel-mcp"
displayName: "FoundryNet Brand Intelligence"
description: >-
  Domain and company enrichment — WHOIS, tech stack detection, SSL monitoring, social presence, and historical snapshots via Wayback Machine.
icon: "🏢"
homepage: "https://foundrynet.io"
repository: "https://github.com/FoundryNet/brand-intel-mcp"
license: "MIT"
categories:
  - data
  - business
  - research
tags:
  - company-enrichment
  - domain-intelligence
  - whois
  - tech-stack
  - brand-research
  - due-diligence
keywords:
  - company-enrichment
  - domain-intelligence
  - whois
  - tech-stack
  - brand-research
  - due-diligence
attestation:
  verified_outputs: true
  method: "cryptographic provenance"
network:
  name: "FoundryNet Data Network"
  servers: 17
startCommand:
  type: http
  url: "https://brand-intel-mcp-production.up.railway.app/mcp"
  transport: streamable-http
  configSchema:
    type: object
    properties:
      api_key:
        type: string
        title: "Forge billing key (optional)"
        description: "fnet_ key to bypass the per-query paywall and bill to a Forge account."
